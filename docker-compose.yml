services:
  postgres-cafeteria:
    image: postgres:16-alpine
    container_name: db_cafeteria
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rootpassword}
      POSTGRES_DB: ${DB_NAME:-cafeteria_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_cafeteria:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-root} -d ${DB_NAME:-cafeteria_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: app_cafeteria
    restart: always
    depends_on:
      postgres-cafeteria:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # DB_URL apunta al nombre del servicio de Postgres dentro de la red de compose, no a localhost.
      DB_URL: jdbc:postgresql://postgres-cafeteria:5432/${DB_NAME:-cafeteria_db}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword}
      # Obligatoria en prod (la app no arranca sin ella); se toma de .env.
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
    ports:
      - "8080:8080"

volumes:
  pgdata_cafeteria:
