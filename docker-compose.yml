services:
  postgres-cafeteria:
    image: postgres:16-alpine
    container_name: db_cafeteria
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rootpassword}
      POSTGRES_DB: ${DB_NAME:-cafeteria_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_cafeteria:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-root} -d ${DB_NAME:-cafeteria_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: app_cafeteria
    restart: always
    depends_on:
      postgres-cafeteria:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # DB_URL apunta al nombre del servicio de Postgres dentro de la red de compose, no a localhost.
      DB_URL: jdbc:postgresql://postgres-cafeteria:5432/${DB_NAME:-cafeteria_db}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword}
      # Obligatoria en prod (la app no arranca sin ella); se toma de .env.
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      # Arranque en frio: con el perfil prod la base recien migrada no tiene con quien hacer
      # login. Encender solo para el primer arranque y apagar tras cambiar la clave.
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
      APP_SEED_EMPLOYEE_EMAIL: ${APP_SEED_EMPLOYEE_EMAIL:-}
      APP_SEED_EMPLOYEE_PASSWORD: ${APP_SEED_EMPLOYEE_PASSWORD:-}
    ports:
      - "8080:8080"
    healthcheck:
      # La imagen de runtime es Alpine sin curl, pero BusyBox trae wget. El grep evita dar por
      # sana una respuesta 503 con cuerpo DOWN mientras Flyway todavia esta migrando.
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      # El arranque de la JVM mas las migraciones tardan mas que un interval; sin esto el
      # contenedor se marcaria unhealthy antes de haber terminado de levantar.
      start_period: 40s

volumes:
  pgdata_cafeteria:
