# Perfil para corridas de pruebas. El datasource lo sobreescribe Testcontainers via
# @ServiceConnection, asi que aqui solo se baja el ruido de logs y se fija un secreto JWT
# de prueba (nunca para produccion).
logging:
  level:
    com.raze.coffeeshop: WARN
    org.hibernate.SQL: WARN

# AuthIntegrationTest comprueba que /v3/api-docs responde sin token, asi que en test la
# documentacion queda publicada. Explicito para no arrastrar el aviso de springdoc en cada
# arranque de contexto de la suite.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:test-only-insecure-secret-change-me-not-for-production-use-0123456789}
  # Cada test arma sus propios datos: un empleado sembrado al arrancar el contexto ensuciaria los
  # conteos. Explicito en false para que la suite no dependa de si APP_SEED_ENABLED esta exportada
  # en la shell de quien la corre.
  seed:
    enabled: false
