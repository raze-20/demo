spring:
  application:
    name: coffee-demo
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cafeteria_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:rootpassword}
  jpa:
    hibernate:
      ddl-auto: validate # REGLA DE ORO: Solo valida que Java y SQL coincidan, NO altera la base.
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        '[format_sql]': true
  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  tax-rate: 0.16
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
