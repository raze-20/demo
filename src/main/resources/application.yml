spring:
  application:
    name: coffeeshop-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cafeteria_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:rootpassword}
  jpa:
    hibernate:
      ddl-auto: validate # REGLA DE ORO: Solo valida que Java y SQL coincidan, NO altera la base.
    # Esta es una API REST: cada service mapea a DTO dentro de su propia @Transactional, asi que
    # no hace falta mantener la sesion de Hibernate abierta hasta que se serializa la respuesta.
    # Dejarlo en true (el default) esconderia consultas N+1 disparadas fuera de la transaccion.
    open-in-view: false
    properties:
      hibernate:
        # El dialecto no se declara: Hibernate lo detecta del driver y declararlo emite HHH90000025.
        '[format_sql]': true
  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  tax-rate: 0.16
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
