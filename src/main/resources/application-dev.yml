logging:
  level:
    com.raze.coffeeshop: DEBUG
    org.hibernate.SQL: DEBUG

spring:
  flyway:
    # Solo dev suma db/seed a las migraciones de esquema. Los datos de demostracion viven en esa
    # location aparte justamente para que no puedan aplicarse en prod al mergear la rama.
    locations: classpath:db/migration,classpath:db/seed
    # El seed usa versiones altas (V900+) para no competir con la numeracion del esquema. Sin
    # out-of-order, agregar despues un V6 en db/migration fallaria en una base dev que ya tiene
    # el V900 aplicado, porque quedaria pendiente una version menor que la ultima migrada.
    out-of-order: true

# En dev la documentacion SI se publica. Se declara explicito (aunque true sea el default)
# porque springdoc avisa en cada arranque mientras la propiedad no este puesta a proposito.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-not-for-production-use-0123456789}
  # Empleado ADMIN que DevDataSeeder crea al arrancar si la base no lo tiene todavia,
  # para poder hacer login desde el front sobre una base recien migrada. Solo perfil dev.
  seed:
    employee:
      email: raze.armando@gmail.com
      password: password
      first-name: Armando
      last-name: Raze
      position: Administrador
    branch:
      name: Sucursal Centro
      address: Av. Principal 100
      city: Ciudad de Mexico
      state: CDMX
